[project]
name = "youtube-tts"
version = "0.1.0"
description = "YouTube LiveのチャットコメントをリアルタイムにVOICEVOXで読み上げるツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.197.0",
    "google-auth>=2.55.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-monitoring>=2.31.0",
    "httpx>=0.28.1",
    "obs-websocket-py>=1.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "callee>=0.3.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
exclude = [
    ".agents",
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    ".venv",
    "__pycache__",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
ignore = [
    "E501",  # 行長オーバー警告は ruff format に任せる
    "D415",  # Docstring 末尾の半角ピリオド必須チェックを無効化 (日本語用)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportAttributeAccessIssue = false
